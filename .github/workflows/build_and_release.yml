name: Build gs-pdv-print-agent

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      console:
        description: "Build de DIAGNÓSTICO com console (mostra o erro na tela em vez de morrer calado)"
        type: boolean
        default: false

jobs:
  # ── Resolve a versão uma única vez ──────────────────────────────────────
  version:
    name: Resolver versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          # Tag 'v1.0.0' → '1.0.0'. Build de branch (sem tag) → '0.0.0-dev'.
          REF="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${REF#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versão=${VERSION}"

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Servidor X virtual: sem ele os testes da JANELA — que é a interface
      # principal desde a v0.3.0 — ficariam pulados no CI para sempre, e a
      # regressão que eles protegem passaria despercebida. `xvfb-run` custa
      # segundos e faz o CI exercitar o Tk de verdade.
      - name: Ambiente gráfico virtual
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - run: xvfb-run -a pytest tests -q

  build-windows:
    name: Windows (.exe)
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyInstaller
        shell: pwsh
        run: |
          $certPath = python -c "import certifi; print(certifi.where())"

          # Build de diagnóstico: `--console` em vez de `--windowed`. Existe
          # porque um executável windowed que falha ANTES do `setup_logging()`
          # — carregador do PyInstaller, import de dependência, DLL ausente —
          # morre sem janela, sem log e sem nada em tela. Aconteceu na v0.3.0.
          # Com console, o erro aparece. Não substitui a release: o job de
          # release só roda em tag, então isto sai apenas como artefato.
          $janela = if ("${{ inputs.console }}" -eq "true") { "--console" } else { "--windowed" }
          Write-Host "Modo de build: $janela"
          # ATENÇÃO: o CI NÃO usa o gs-pdv-print-agent.spec — as opções abaixo
          # precisam ficar em sincronia com ele à mão. Mesma armadilha já
          # documentada no CLAUDE.md do monorepo para o GS-PDV desktop.
          #
          # `--windowed` (2026-08-17): o agente virou aplicação desktop, e um
          # console preto atrás da janela é fechado por engano, derrubando a
          # impressão da loja. Só é seguro porque o log passou a ir para
          # arquivo (app/logging_setup.py). Modo serviço continua disponível
          # via `--headless`.
          #
          # `--collect-all tkinter` (v0.3.0): a janela virou a interface
          # PRINCIPAL, e `--hidden-import` sozinho traz o módulo mas não
          # garante os dados do Tcl/Tk. Sem eles o .exe sobe e a janela falha
          # só na máquina do cliente. Mesma opção precisa existir no .spec.
          # `--onefile` (2026-08-19, decisão do usuário): o build padrão do
          # PyInstaller é uma PASTA, e o zip do Windows extraía 1.083
          # arquivos. Numa loja isso vira "qual desses eu abro?", e mover a
          # pasta pela metade quebra o agente. Um arquivo só resolve —
          # inicia um pouco mais devagar (o carregador extrai para o temp a
          # cada execução) e é o preço aceito.
          #
          # O `config.json` continua sendo procurado AO LADO DO EXECUTÁVEL,
          # não dentro do temp: `_default_config_dir()` usa `sys.executable`,
          # que no onefile é o .exe de verdade — não o `sys._MEIPASS`. Há
          # teste cobrindo (tests/test_config_path.py).
          #
          # O .spec do build local JÁ era onefile (não tem `COLLECT`), então
          # esta mudança alinha o Windows com o Linux em vez de divergir.
          #
          # `--splash` (2026-08-19): consequência direta do onefile — o
          # carregador descompacta ~28MB a cada execução e ficavam segundos com
          # NADA na tela ("parece que trava e do nada abre"). O splash é
          # desenhado pelo bootloader antes de o Python subir, que é exatamente
          # o intervalo sem feedback; o agente o fecha quando a janela abre.
          pyinstaller --noconfirm `
            --name gs-pdv-print-agent `
            --onefile `
            $janela `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import certifi `
            --hidden-import win32print `
            --hidden-import win32api `
            --hidden-import pywintypes `
            --hidden-import pystray `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.messagebox `
            --collect-all tkinter `
            --splash app/assets/splash.png `
            --add-data "${certPath};certifi" `
            main.py

      - name: Empacotar
        shell: pwsh
        run: |
          # Com `--onefile` o resultado é `dist/gs-pdv-print-agent.exe`, não
          # mais uma pasta. O zip continua existindo porque é o formato que o
          # painel manda o lojista baixar, e porque navegador trata .exe solto
          # com mais atrito ainda que .zip.
          if (-not (Test-Path dist/gs-pdv-print-agent.exe)) {
            throw "esperava um executável único em dist/ — o --onefile saiu do build?"
          }
          Compress-Archive -Path dist/gs-pdv-print-agent.exe -DestinationPath gs-pdv-print-agent-windows-v${{ needs.version.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gs-pdv-print-agent-windows${{ inputs.console == true && '-DIAGNOSTICO-console' || '' }}
          path: gs-pdv-print-agent-windows-v${{ needs.version.outputs.version }}.zip

  build-linux:
    name: Linux
    needs: [version, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyInstaller
        run: |
          pyinstaller --noconfirm gs-pdv-print-agent.spec

      - name: Empacotar
        run: |
          tar -czf gs-pdv-print-agent-linux-v${{ needs.version.outputs.version }}.tar.gz -C dist gs-pdv-print-agent

      - uses: actions/upload-artifact@v4
        with:
          name: gs-pdv-print-agent-linux
          path: gs-pdv-print-agent-linux-v${{ needs.version.outputs.version }}.tar.gz

  release:
    name: Criar Release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gs-pdv-print-agent-windows/gs-pdv-print-agent-windows-v${{ needs.version.outputs.version }}.zip
            gs-pdv-print-agent-linux/gs-pdv-print-agent-linux-v${{ needs.version.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
